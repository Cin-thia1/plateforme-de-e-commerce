<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Import commun a toutes les pages-->
  <link rel="stylesheet" href="../assets/css/header-footer.css">
  <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">


  <title>Header</title>
</head>
<body>
    <header class="main-header">
        <!-- Superbar : message + réseaux + langue/devise -->
        <div class="superbar">
        <div class="container super-wrap">
            <div class="super-left">Bienvenue chez SHONOW votre boutique de e-commerce en ligne</div>
            <div class="super-right">
                <div class="social">Nous suivre:
                    <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                    <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" aria-label="Pinterest"><i class="fab fa-pinterest"></i></a>
                    <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                </div>
                <div class="dropdown">
                    <div class="pill">Eng ▾</div>
                    <div class="dropdown-content" id="langue">
                        <a href="#">French</a>
                        <a href="#">English</a>
                        <a href="#">Deush</a>
                        <a href="#">Spanish</a>
                        <a href="#">Japanese</a>
                    </div>
                </div>
                <div class="dropdown">
                    <div class="pill">USD ▾</div>
                    <div class="dropdown-content" id ="devise">
                        <a href="#">EUR</a>
                        <a href="#">XAF</a>
                        <a href="#">XOF</a>
                        <a href="#">YUEN</a>
                        <a href="#">LIVRE</a>
                    </div>
                </div>
            </div>
        </div>
        </div>

        <!-- Barre principale -->
        <div class="container main-wrap">
            <a class="brand" href="/">
            <span class="brand__mark">●</span>
            <span class="brand__name">SHOPNOW</span>
            </a>

            <div class="search" role="search">
            <form action="/recherche" method="get">
                <label for="q" class="visually-hidden">Search</label>
                <input id="q" name="q" type="search" placeholder="Search for anything..." />
                <button type="submit" aria-label="Rechercher"><i class="fas fa-search"></i></button>
            </form>
            </div>

            <div class="actions" aria-label="Actions utilisateur">
            <a class="icon-btn" href="/panier" title="Panier"><i class="fas fa-shopping-cart"></i><span class="badge">2</span></a>
            <a class="icon-btn" href="/favoris" title="Favoris"><i class="fas fa-heart"></i></a>
            <a class="icon-btn" href="/compte" title="Mon compte"><i class="fas fa-user"></i></a>
            </div>
        </div>

        <!-- bottom barre -->
        <div class="top-bar">
            <div class="left-section">
                <div class="dropdown">
                    <button class="dropdown-btn">All Category</button>
                    <div class="dropdown-content">
                        <a href="#">Smartphones</a>
                        <a href="#">Laptops</a>
                        <a href="#">Gaming</a>
                        <a href="#">Accessories</a>
                        <a href="#">Home Appliances</a>
                    </div>
                </div>

                <a href="#"><i class="fas fa-truck"></i> Track Order</a>
                <a href="#"><i class="fas fa-question-circle"></i> Customer Support</a>
                <a href="#"><i class="fa-solid fa-users"></i> About Us</a>

            </div>

            <div class="right-section">
                <i class="fas fa-phone-alt"></i> +237 - 655 884 341
            </div>
        </div>

    </header>
