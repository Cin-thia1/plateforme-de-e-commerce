<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié</title>
    
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/forget-password.css">
</head>
<body>

    <main class="form-container">
        
        <form action="#">
            <h2>Forget Password</h2>
            
            <p class="description">
                Enter the email address or mobile phone number associated with your Ourican account.
            </p>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit" class="btn-submit">
                <span>SEND CODE</span>
                <i class="fas fa-arrow-right"></i>
            </button>
            
            <hr class="separator">

            <div class="links-group">
                <p>
                    Already have account? <a href="#" class="link-sign">Sign In</a>
                </p>
                <p>
                    Don't have account? <a href="#" class="link-sign">Sign Up</a>
                </p>
            </div>

            <p class="customer-service-note">
                You may contact <a href="#" class="link-service">Customer Service</a> for help restoring access to your account.
            </p>
        </form>

    </main>

</body>
</html>
