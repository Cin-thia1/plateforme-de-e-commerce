<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/stylePanier.css">
  <!-- Icônes Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- En-tête avec bande colorée -->
  <header class="header">
    <div class="header-band">
      <h1>🛒 Ma Boutique</h1>
      <nav>
        <a href="home.html">Accueil</a>
        <a href="liste_produits.html">Produits</a>
        <a href="panier.html" class="active">Panier</a>
      </nav>
    </div>
  </header>

  <!-- Contenu principal -->
  <main class="container">
    <h2>Mon Panier</h2>
    <table class="panier-table">
      <thead>
        <tr>
          <th>Image</th>
          <th>Produit</th>
          <th>Prix</th>
          <th>Quantité</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><img src="assets/images/casque.png" alt="Casque"></td>
          <td>Casque Bluetooth</td>
          <td>15 000 FCFA</td>
          <td><input type="number" value="1" min="1"></td>
          <td>15 000 FCFA</td>
          <td><button class="btn-supprimer"><i class="fa fa-trash"></i> Supprimer</button></td>
        </tr>
        <tr>
          <td><img src="assets/images/ps5.png" alt="PS5"></td>
          <td>PlayStation 5</td>
          <td>20 000 FCFA</td>
          <td><input type="number" value="1" min="1"></td>
          <td>20 000 FCFA</td>
          <td><button class="btn-supprimer"><i class="fa fa-trash"></i> Supprimer</button></td>
        </tr>
      </tbody>
    </table>

    <div class="total-container">
      <h3>Total : <span>35 000 FCFA</span></h3>
      <a href="#formulaire-commande" class="btn-valider"><i class="fa fa-check"></i> Valider la commande</a>
    </div>

    <!-- Formulaire de validation de commande -->
    <section id="formulaire-commande" class="form-section">
      <h3>🧾 Informations de livraison</h3>
      <form>
        <div class="form-group">
          <label for="nom">Nom complet :</label>
          <input type="text" id="nom" name="nom" placeholder="Ex: Jean Dupont" required>
        </div>

        <div class="form-group">
          <label for="adresse">Adresse :</label>
          <input type="text" id="adresse" name="adresse" placeholder="Ex: Rue des Marchés, Douala" required>
        </div>

        <div class="form-group">
          <label for="email">Adresse e-mail :</label>
          <input type="email" id="email" name="email" placeholder="Ex: jean.dupont@gmail.com" required>
        </div>

        <button type="submit" class="btn-valider"><i class="fa fa-paper-plane"></i> Confirmer la commande</button>
      </form>
    </section>
  </main>

  <!-- Pied de page -->
  <footer class="footer">
    <p>&copy; 2025 Ma Boutique - Tous droits réservés.</p>
  </footer>

</body>
</html>
